name: Generate profile summary cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: vn7n24fzkq/github-profile-summary-cards@v0.6.0
        with:
          USERNAME: DomiRosario
          BRANCH_NAME: main
          UTC_OFFSET: "+02:00"
          THEME: github_dark
          AUTO_PUSH: true
          EXCLUDE: ""
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
